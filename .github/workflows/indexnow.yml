name: IndexNow

# Pings IndexNow with the full sitemap after each successful production deploy.
# Vercel's GitHub integration creates a GitHub deployment (environment
# "Production") per prod deploy and marks it "success" once it's live, which
# fires deployment_status here. workflow_dispatch is a manual fallback.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'Production' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.ts
